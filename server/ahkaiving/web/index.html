<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AH!chiving — 자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{--rail:#15181e;--line:#e6e8ec;--ink:#1f2430;--muted:#8b9099;--blue:#2563eb;--card:#f7f8fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);height:100vh;height:100dvh;display:grid;grid-template-columns:320px 1fr;grid-template-rows:100vh;grid-template-rows:100dvh;overflow:hidden;transition:grid-template-columns .26s cubic-bezier(.4,0,.2,1)}
  .ic{width:1em;height:1em;vertical-align:-.12em;flex:none}
  .sic{object-fit:contain;border-radius:3px}
  /* 흰 타일은 '배경 투명 + 내용 어두움' favicon에만(ficBg가 픽셀 분석해 부여). 통짜 색 favicon엔 안 깖. */
  .sic.ficbg{background:#fff;padding:2px;box-sizing:border-box;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
  /* rail */
  .rail{background:var(--rail);color:#e9ecf1;overflow:hidden;min-height:0;min-width:0}
  .railin{width:320px;box-sizing:border-box;height:100%;padding:16px 13px;overflow-y:auto;overflow-x:hidden}
  .brand{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:2px 4px 16px}
  .railtop{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
  .railtop .brand{margin:0}
  .railham{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#ffffff14;border:1px solid #ffffff26;border-radius:7px;color:#e9ecf1;font-size:15px;line-height:1;cursor:pointer;transition:.12s}
  .railham:hover{background:#ffffff2e;color:#fff}
  .brand b{color:#fff;font-weight:700}.brand span{color:#fff;opacity:1;font-weight:700}
  .drop{display:block;border:1px solid #2b3340;background:#1a1f28;border-radius:9px;padding:14px 12px;text-align:center;color:#99a0ac;font-size:12px;line-height:1.55;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--blue);color:#fff;background:#18233550}
  .drop b{color:#eaecef;font-weight:700;font-size:13px}
  .linkrow{display:flex;gap:6px;margin-top:8px}
  .linkrow input,.search input{width:100%;min-width:0;background:#1b2028;border:1px solid #333a46;border-radius:6px;padding:8px 10px;color:#e9ecf1;font:inherit;font-size:12.5px}
  .linkrow input::placeholder,.search input::placeholder{color:#6b7280}
  .linkrow input:focus,.search input:focus{outline:none;border-color:var(--blue)}
  .linkrow button{flex:none;white-space:nowrap;background:#242c38;border:1px solid #333c4a;border-radius:6px;color:#dfe3ea;font:inherit;font-size:12px;font-weight:650;padding:0 13px;cursor:pointer;transition:.12s}
  .linkrow button:hover{background:#2b3442;border-color:#3f4a5a;color:#fff}
  .linkrow button:disabled{opacity:.5}
  .hint{font-size:11px;color:#6b7280;margin:9px 4px;line-height:1.5}
  .search{position:relative;margin:4px 0 8px}
  .search .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#6b7280;font-size:14px}
  .search input{padding-right:32px}
  .mi{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:9px 9px;cursor:pointer;color:#dfe3ea}
  .mi:hover{background:#1e232c}.mi.on{background:#222a36}
  .mic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;color:#8b94a6}
  .rail .bic{color:#d4dae4 !important}  /* 다크 rail에선 브랜드색 대신 밝은 단색(검정 로고도 보이게) */
  .mi.on .bic{color:#f0f3f8 !important}
  .mi.on .mic{color:#cdd4e0}
  .mi .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mi .s{font-size:11px;color:#7b8291}
  .empty{color:#6b7280;font-size:13px;padding:14px 6px}
  /* main */
  main{background:#fff;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .vhead{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .vhead h1{font-size:17px;font-weight:750;margin:0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px;align-items:center}
  .meta b{color:var(--ink);font-weight:650}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-weight:650;color:var(--ink)}
  a.chip{text-decoration:none}
  /* stepper */
  .step{display:flex;align-items:center;gap:0;margin-top:9px}
  .step .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .step .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
  .step .st.done .dot{background:var(--blue);border-color:var(--blue)}
  .step .st.cur .dot{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb22}
  .step .st.done,.step .st.cur{color:var(--ink);font-weight:650}
  .step .bar{width:26px;height:2px;background:var(--line);margin:0 2px}
  .step .bar.done{background:var(--blue)}
  /* review 2-col */
  .review{flex:1;min-height:0;display:grid;grid-template-columns:1fr 360px}
  .orig{min-width:0;background:#525659;overflow:hidden;display:flex}
  .orig iframe,.orig img{width:100%;height:100%;border:0;display:block}
  .orig img{object-fit:contain;background:#2b2f33}
  .orig .raw{background:#fff;color:var(--ink);padding:26px;overflow:auto;white-space:pre-wrap;font-size:14px;line-height:1.7;width:100%}
  .side{border-left:1px solid var(--line);overflow-y:auto;background:#fff;display:flex;flex-direction:column}
  .kw{padding:12px 14px;border-bottom:1px solid var(--line)}
  .kw .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:7px}
  .kwchips{display:flex;flex-wrap:wrap;gap:5px}
  .kwc{display:inline-flex;align-items:center;gap:4px;background:#eef1ff;color:#2846c9;border:1px solid #d6ddfb;border-radius:5px;padding:3px 7px;font-size:12px;font-weight:600}
  .kwc b{cursor:pointer;opacity:.6;font-weight:700}.kwc b:hover{opacity:1}
  .kwadd{border:1px dashed #c7ccd6;background:#fff;color:var(--muted);border-radius:5px;padding:3px 8px;font-size:12px;cursor:pointer}
  .kwinput{border:1px solid var(--blue);border-radius:5px;padding:2px 6px;font:inherit;font-size:12px;width:92px;outline:none}
  .stabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
  .stab{font:inherit;font-size:12.5px;font-weight:650;color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .stab.on{color:var(--ink);border-bottom-color:var(--blue)}
  .spanel{padding:14px;flex:1}
  .spanel textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:7px;padding:11px;font:inherit;font-size:13.5px;line-height:1.65;color:var(--ink);resize:vertical;outline:none}
  .spanel textarea:focus{border-color:var(--blue)}
  .ph{color:var(--muted);font-size:12px;margin:6px 2px 0}
  .acts{display:flex;gap:6px;flex:none}
  .chip.del{cursor:pointer;color:#c0392b;border-color:#f0c9c2}
  .chip.del:hover{background:#fdecea}
  .chip.del.danger{background:#c0392b;color:#fff;border-color:#c0392b}
  .trbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .trbtn{background:#eef1ff;border:1px solid #d6ddfb;color:#2846c9;border-radius:6px;padding:7px 11px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
  .trbtn:hover{background:#e3e8ff}.trbtn:disabled{opacity:.6;cursor:default}
  .trmsg{font-size:12px;color:var(--muted)}
  .minibtn{font:inherit;font-size:11px;font-weight:650;color:var(--blue);background:#eef1ff;border:1px solid #d6ddfb;border-radius:5px;padding:3px 7px;cursor:pointer;margin-left:6px}
  .minibtn:disabled{opacity:.6}
  .smbox{background:#f3f6ff;border:1px solid #dfe6ff;border-radius:7px;padding:11px 12px;font-size:13px;line-height:1.65;color:var(--ink);margin:2px 0 10px;white-space:pre-wrap}
  .smedit{width:100%;min-height:90px;border:1px solid var(--blue);border-radius:7px;padding:10px;font:inherit;font-size:12px;line-height:1.6;color:var(--ink);resize:vertical;outline:none;margin:2px 0 10px}
  .minibtn.alt{color:var(--muted);background:#f1f3f5;border-color:#e3e6ea}
  .srcchip{color:var(--blue);border-color:#cdd7f5}.srcchip:hover{background:#eef2ff}
  .trout{border:1px solid var(--line);border-radius:7px;padding:12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;color:var(--ink);min-height:110px;max-height:46vh;overflow:auto;background:#fcfdff}
  .trsub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:16px 0 7px}
  .linkwrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;padding:30px}
  .linkcard{max-width:580px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .linkcard .lw-ic{font-size:28px}
  .linkcard .u{font-size:14px;color:var(--blue);word-break:break-all}
  .linkcard .lw-err{background:#fff4e5;border:1px solid #ffd9a8;color:#9a5b00;border-radius:8px;padding:12px 14px;font-size:13px;font-weight:650;width:100%}
  .linkcard .lw-why{font-weight:400;font-size:11.5px;color:#b07a2e;margin-top:5px;word-break:break-all}
  .linkcard a.open{background:var(--blue);color:#fff;text-decoration:none;border-radius:7px;padding:10px 20px;font-weight:650;font-size:13.5px}
  .linkcard .lw-tip{font-size:12.5px;color:var(--muted);line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left}
  .linkcard .lw-tip b{color:var(--ink)}
  .gloss .grow{display:flex;gap:7px;margin-bottom:7px}
  .gloss .grow input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px;outline:none}
  .gloss .grow input.term{width:120px;flex:none;font-weight:650}
  .gloss .grow input.mean{flex:1;min-width:0}
  .gloss .grow input:focus{border-color:var(--blue)}
  .gloss .del{border:0;background:#f2f3f5;color:var(--muted);border-radius:6px;padding:0 9px;cursor:pointer}
  .savedot{font-size:11px;color:#16a34a;margin-left:8px;opacity:0;transition:.2s}
  .savedot.on{opacity:1}
  .dup{margin:0 4px 8px;font-size:11.5px;color:#f0b24a;background:#2a2410;border:1px solid #4a3f17;border-radius:6px;padding:7px 9px;display:none}
  @media(max-width:1040px){.review{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}}
  /* ── 전반적 글자 축소 ── */
  .brand{font-size:18px}
  .vhead{padding:12px 18px}
  .vhead h1{font-size:14.5px}
  .meta{font-size:10.5px;gap:7px}
  .chip{font-size:11px;padding:2px 7px}
  .mi .t{font-size:12px}.mi .s{font-size:10.5px}
  .mic{font-size:14px}
  .step .st{font-size:10px}
  .kw .lbl{font-size:10px}
  .smbox{font-size:11.5px;line-height:1.6;padding:10px 11px}
  .kwc{font-size:11px}.kwadd,.kwinput{font-size:11px}
  .stab{font-size:11.5px;padding:6px 7px}
  .trbtn{font-size:12px;padding:6px 10px}.minibtn{font-size:10.5px}
  .trout{font-size:12px;line-height:1.6}
  .spanel textarea{font-size:12px;min-height:220px}
  .trmsg,.ph{font-size:11px}
  .gloss .grow input{font-size:12px}
  .linkcard .u{font-size:12.5px}.linkcard .lw-tip{font-size:11.5px}
  .drop{font-size:12px}.hint{font-size:10.5px}
  .linkrow input,.search input{font-size:11.5px}
  .reader{width:100%;height:100%;overflow:auto;background:#fff}
  .readerin{max-width:680px;margin:0 auto;padding:30px 28px;font-size:13.5px;line-height:1.85;color:#2a2f38}
  .readerin p{margin:0 0 13px;white-space:pre-wrap}
  .readernote{margin-top:20px;padding-top:13px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .readernote a{color:var(--blue)}
  .origwrap{width:100%;height:100%;display:flex;flex-direction:column;background:#525659}
  .otoggle{display:flex;gap:4px;padding:7px 10px;background:#2b2f33;flex:none}
  .otoggle button{font:inherit;font-size:11px;font-weight:650;color:#c7ccd4;background:transparent;border:1px solid #454a50;border-radius:5px;padding:4px 9px;cursor:pointer}
  .otoggle button.on{background:#fff;color:#1f2430;border-color:#fff}
  .origview{flex:1;min-height:0;display:flex}
  .origview iframe,.origview .reader{width:100%;height:100%;border:0}
  /* ── 홈 보드 ── */
  .home{flex:1;min-height:0;overflow:auto;padding:22px 26px;background:#fff}
  .home .hin{max-width:none;margin:0}
  .home h2,.sblabel{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px;color:var(--ink)}
  .home .sub{font-size:12px;color:var(--muted);margin:0 0 18px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:14px 15px;background:var(--card)}
  .kpi .n{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
  .kpi .n small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
  .kpi.warn .n{color:#b8720a}.kpi.go .n{color:#157347}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
  @media(max-width:860px){.hgrid{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);border-radius:10px;padding:15px 16px}
  .panel .ph2{font-size:12px;font-weight:750;color:var(--ink);margin:0 0 13px;letter-spacing:-.01em}
  .sbar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .sbar .lab{font-size:11.5px;color:var(--muted);width:60px;flex:none;text-align:right;font-weight:600}
  .sbar .track{flex:1;height:9px;background:#eef0f3;border-radius:5px;overflow:hidden}
  .sbar .fill{height:100%;background:var(--blue);border-radius:5px;min-width:3px}
  .sbar .val{font-size:11.5px;color:var(--ink);font-weight:700;width:20px;flex:none}
  .kinds{display:flex;flex-wrap:wrap;gap:7px}
  .kindchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
  .kindchip:hover{border-color:var(--blue);color:var(--blue)}
  .kindchip .c{font-size:11px;color:var(--muted);font-weight:700}
  .rechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 11px}
  .rechead .ph2{margin:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
  .card{text-align:left;border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:8px;min-width:0;font:inherit}
  .card:hover{border-color:#c4cfe8;box-shadow:0 3px 12px #1f24300d;transform:translateY(-1px)}
  .card .ct{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:650;color:var(--muted)}
  .card .ct .ic{color:#8b94a6}
  .card .st-badge{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:#fff}
  .card .st-badge.enriched{color:#157347;background:#e8f6ee;border-color:#bfe3cd}
  .card h3{font-size:13px;font-weight:700;margin:0;color:var(--ink);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .ctags{display:flex;flex-wrap:wrap;gap:4px}
  .card .ctag{font-size:10.5px;color:#2846c9;background:#eef1ff;border:1px solid #d6ddfb;border-radius:4px;padding:1px 6px;font-weight:600}
  .card .ctr{font-size:10.5px;color:#157347;font-weight:650}
  /* 입력 묶음 */
  .addbox{border:1px solid #2b3340;background:#1a1f28;border-radius:10px;padding:8px;margin-bottom:9px;transition:.15s}
  .addbox.over{border-color:var(--blue);border-style:dashed;background:#18233550}
  .addbox .linkrow{margin:0}
  .filebar{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:7px;padding:8px 10px;background:#1b2028;border:1px solid #333a46;border-radius:6px;color:#c7ccd4;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
  .filebar:hover{border-color:var(--blue);color:#fff}
  .homebtn{display:flex;align-items:center;gap:7px;width:100%;background:#1e232c;border:1px solid #2b3340;border-radius:7px;color:#cdd4e0;font:inherit;font-size:12.5px;font-weight:650;padding:8px 11px;cursor:pointer;margin:0 0 11px}
  .homebtn:hover{background:#242c38;color:#fff}
  .homebtn .ic{color:#8b94a6;font-size:15px}
  .listhead{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;font-weight:700;margin:20px 4px 8px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
  /* 홈 전체 자료 카탈로그 */
  .catalog{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .crow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:11px 14px;cursor:pointer;font:inherit}
  .crow:first-child{border-top:0}
  .crow:hover{background:var(--card)}
  .crow .ci{width:22px;flex:none;display:flex;align-items:center;color:#8b94a6}
  .crow .cmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
  .crow .ctitle{font-size:13px;font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .csub{font-size:11px;color:var(--muted)}
  .crow .cmeta{flex:none;display:flex;align-items:center;gap:5px}
  .crow .cmeta .ctag{font-size:10.5px;color:#2846c9;background:#eef1ff;border:1px solid #d6ddfb;border-radius:4px;padding:1px 6px;font-weight:600}
  .crow .cmeta .tr{font-size:13px}
  .startbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:var(--blue);border:1px solid var(--blue);border-radius:8px;color:#fff;font:inherit;font-size:13px;font-weight:700;padding:11px;cursor:pointer;margin:0 0 11px;transition:.12s}
  .startbtn:hover{background:#1d57d6}
  .mcard.start{max-width:480px;padding:26px 26px 22px}
  .mcard.start .mt{margin-bottom:22px}
  .sllabel{display:block;font-size:11px;color:var(--muted);font-weight:650;margin:0 0 6px}
  .slrow{display:flex;gap:8px;align-items:stretch}
  .slrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:11px 12px;font:inherit;font-size:13.5px;color:var(--ink);outline:none}
  .slrow input:focus{border-color:var(--blue)}
  .slrow .mbtn{flex:none}
  .ordiv{display:flex;align-items:center;gap:10px;margin:15px 0;color:var(--muted);font-size:11px}
  .ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--line)}
  .filepick{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1px solid var(--line);border-radius:4px;padding:12px;font:inherit;font-size:13px;font-weight:650;color:var(--ink);background:var(--card);cursor:pointer}
  .filepick:hover{border-color:var(--blue);color:var(--blue)}

function loadRecents(){try{const a=JSON.parse(localStorage.getItem('ahk_recents')||'[]');return Array.isArray(a)?a.map(x=>typeof x==='string'?{id:x,ts:0}:x).filter(x=>x&&x.id):[];}catch(e){return [];}}
function touchRecent(id){try{const cut=_today0();let r=loadRecents().filter(x=>x.id!==id&&x.ts>=cut);r.unshift({id,ts:Date.now()});localStorage.setItem('ahk_recents',JSON.stringify(r.slice(0,50)));}catch(e){}}
function orderedItems(){
  if(q) return items.filter(match);
  const cut=_today0();                                    // '최근 본 자료' = 오늘 본 자료만 (최근 본 순)
  const r=loadRecents().filter(x=>x.ts>=cut); const pos=new Map(r.map((o,x)=>[o.id,x]));
  return items.filter(i=>pos.has(i.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id));
}
function openItem(id){go(id);}
// ── URL 라우팅(History API): 상세는 ?id=<id> 로 주소가 바뀐다 → 딥링크·뒤로가기·새로고침 복원 ──
function go(id){
  const url = id ? (location.pathname+'?id='+encodeURIComponent(id)) : location.pathname;
  if(id!==(new URLSearchParams(location.search).get('id'))) history.pushState({id:id||null},'',url);
  renderRoute();
}
function renderRoute(){
  const id = new URLSearchParams(location.search).get('id');
  const it = id ? items.find(i=>i.id===id) : null;
  if(it){ sel=it.id; touchRecent(it.id); renderList(); renderDetail(it); }
  else { sel=null; renderList(); renderHome(); }
}
window.addEventListener('popstate', renderRoute);

async function load(){
  const r=await fetch('/api/materials'); items=await r.json();
  try{ const rs=await fetch('/api/sites'); sites=await rs.json(); if(!Array.isArray(sites))sites=[]; }catch(e){ sites=[]; }

}
function match(i){
  if(!q) return true; const s=q.toLowerCase();
  const ex=i.extensions||{};
  return (i.title||'').toLowerCase().includes(s)
    || (i.tags||[]).join(' ').toLowerCase().includes(s)
    || (ex.notes||'').toLowerCase().includes(s)
    || (ex.text||'').toLowerCase().includes(s)
    || (i.kind||'').toLowerCase().includes(s);
}

function origUrl(i){const rel=(i.original_files[0]||'').replace(/^original\//,'');return `/api/materials/${i.id}/original/${rel.split('/').map(encodeURIComponent).join('/')}`;}
function coverUrl(i){

  const c=dv.find(f=>/cover\.(png|jpg|jpeg|webp)$/i.test(f)) || dv.find(f=>/page-0*1\.(png|jpg|jpeg|webp)$/i.test(f));

function stepper(status){
  const cur=STEP_IDX[status]??0;
  return `<div class="step">`+STEPS.map((s,x)=>{
    const cls=x<cur?'done':x===cur?'cur':'';
    const dot=x<cur?'<span class="dot">✓</span>':'<span class="dot"></span>';
    return (x>0?`<span class="bar ${x<=cur?'done':''}"></span>`:'')+`<span class="st ${cls}">${dot}${s[0]}</span>`;
  }).join('')+`</div>`;
}
function declutterFrame(fr){
  // 스냅샷을 볼 때만 전역 메뉴/헤더/푸터를 숨긴다(원본 파일은 그대로). 같은 오리진이라 접근 가능.
  try{
    const d=fr.contentDocument; if(!d||!d.head) return;
    if(d.getElementById('ahk-dc')) return;
    const s=d.createElement('style'); s.id='ahk-dc';
    s.textContent='header,nav,footer,aside,[role=banner],[role=navigation],[role=contentinfo],'
      +'.top-nav,.global-nav,.global-footer,.navbar,.site-header,.site-footer,'
      +'.authwall,.law-footer,.sign-in-modal,.join-form,.signup-modal,.login-modal,'
      +'.cookie,.cookie-banner,.consent,.gdpr,.promo-banner,.newsletter,.subscribe-banner,'
      +'.ad,.ads,.advertisement,.sponsored,.related,.recommended,.social-share,.share-buttons,'
      +'.comment-form,.comments-cta,.paywall,.popup,.overlay{display:none!important}';
    d.head.appendChild(s);
    // 난독화 클래스라 선택자로 못 잡는 잡텍스트는 '텍스트 패턴'으로 숨김(팔로워 수·Follow·프로필 등)
    const PATS=[/^[\d.,]+\s*(followers?|connections?|posts?|팔로워|게시물|명)$/i,/^\+?\s*follow(ing)?$/i,
      /^view profile$/i,/^connect$/i,/^message$/i,/^subscribe$/i,/^sign in$/i,/^join( now)?$/i,
      /^skip to main content$/i,/^report this post$/i,/^follow$/i];
    d.querySelectorAll('a,button,span,li,h2,h3').forEach(el=>{
      const t=(el.textContent||'').trim();
      if(t && t.length<=24 && PATS.some(re=>re.test(t))){ el.style.display='none'; }
    });
  }catch(e){}
}

function confirmBox(o){
  return new Promise(res=>{
    const m=$('#modal');
    $('#mtitle').textContent=o.title||'확인'; $('#mbody').textContent=o.body||'';
    const y=$('#myes'),no=$('#mno'); y.textContent=o.yes||'확인';
    m.hidden=false;
    const close=v=>{m.hidden=true;y.onclick=null;no.onclick=null;m.onclick=null;document.onkeydown=null;res(v);};
    y.onclick=()=>close(true); no.onclick=()=>close(false);
    m.onclick=e=>{if(e.target===m)close(false);};
    document.onkeydown=e=>{if(e.key==='Escape')close(false);else if(e.key==='Enter')close(true);};
  });
}
function dateOK(created){
  // 수집일(created_at) 기준 기간 필터. 캘린더 뷰는 자체 월 이동이 있어 적용하지 않음.
  if(homeDate==='all'||homeView==='calendar')return true;
  const d=new Date((created||'').slice(0,10)+'T00:00:00'); if(isNaN(d))return false;
  const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(); const DAY=864e5;
  if(homeDate==='today')return d.getTime()===today;
  if(homeDate==='7d')return d.getTime()>=today-6*DAY;
  if(homeDate==='30d')return d.getTime()>=today-29*DAY;
  if(homeDate==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  return true;
}
function homeItems(){
  return items.filter(i=>{
    if(homeCat){ const c=kindKey(i)||'_none'; if(c!==homeCat) return false; }
    if(!dateOK(i.created_at)) return false;
    if(homeQ){ const s=homeQ.toLowerCase(); const ex=i.extensions||{};
      if(!((i.title||'').toLowerCase().includes(s)||(i.tags||[]).join(' ').toLowerCase().includes(s)||(ex.text||'').toLowerCase().includes(s)||(i.kind||'').toLowerCase().includes(s))) return false;
    }
    return true;
  });
}

    <div class="hfilter">${kchip('','전체')}${catChips.map(([k,l])=>kchip(k,l)).join('')}</div>

function siteDom(s){ let d=s.url; try{ d=new URL(s.url).hostname.replace(/^www\./,''); }catch(e){} return d; }
function siteFav(s,favClass){ const letter=esc((s.title||siteDom(s)||'?').trim().charAt(0).toUpperCase()||'?');
  const img=s.icon?`<img src="/api/sites/${esc(s.id)}/icon?v=${encodeURIComponent(s.icon)}" alt="" draggable="false" onerror="this.closest('.${favClass}').classList.add('noimg');this.remove();">`:'';
  return `<span class="${favClass} ${s.icon?'':'noimg'}" data-letter="${letter}">${img}</span>`; }
function siteNodeById(id){ for(const n of (sites||[])){ if(n.id===id)return n; if(n.kind==='folder'){ const s=(n.items||[]).find(x=>x.id===id); if(s)return s; } } return null; }
function topIndex(id){ return (sites||[]).findIndex(n=>n.id===id); }
function removeNode(id){  // 트리에서 노드 제거 후 반환(폴더 안도 탐색). 빈 폴더 자동 제거.
  let found=null;
  sites=(sites||[]).filter(n=>{ if(n.id===id){found=n;return false;} return true; });
  if(!found){ for(const n of sites){ if(n.kind==='folder'){ const i=(n.items||[]).findIndex(x=>x.id===id); if(i>=0){ found=n.items[i]; n.items.splice(i,1); } } } }
  sites=(sites||[]).filter(n=>!(n.kind==='folder'&&(!n.items||!n.items.length)));
  return found;
}

function combineNodes(dragId,targetId){
  const target=siteNodeById(targetId); if(!target||dragId===targetId)return;
  const dn=removeNode(dragId); if(!dn){renderHome();return;}
  if(target.kind==='folder'){ target.items=target.items||[]; target.items.push(dn); }
  else { const i=topIndex(targetId);
    if(i<0){ sites.push(dn); }
    else { const folder={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind:'folder',title:'폴더',items:[target,dn]}; sites.splice(i,1,folder); } }
  renderHome(); saveSites();
}
function reorderNode(dragId,targetId,before){
  if(dragId===targetId)return;
  const dn=removeNode(dragId); if(!dn){renderHome();return;}
  const ti=topIndex(targetId);
  if(ti<0) sites.push(dn); else sites.splice(before?ti:ti+1,0,dn);
  renderHome(); saveSites();

function wireSiteDrag(){
  // 드롭 위치로 판정(타이머 없음): 카드 가운데(25~75%)에 놓으면 폴더로 묶기, 가장자리면 순서 이동.
  const combineAt=(card,clientX)=>{ const r=card.getBoundingClientRect(); const frac=(clientX-r.left)/r.width;
    const dn=siteNodeById(dragSiteId); return { frac, combine: !!(dn&&dn.kind==='site'&&frac>0.25&&frac<0.75) }; };
  document.querySelectorAll('.sbrow .sbcard[draggable="true"]').forEach(card=>{
    card.ondragstart=e=>{ dragSiteId=card.dataset.id; card.classList.add('dragging'); try{e.dataTransfer.setData('text/plain',dragSiteId);e.dataTransfer.effectAllowed='move';}catch(_){} };
    card.ondragend=()=>{ dragSiteId=null; document.querySelectorAll('.sbcard').forEach(c=>c.classList.remove('dragging','combine','insbefore','insafter')); };
    card.ondragover=e=>{ if(!dragSiteId||card.dataset.id===dragSiteId)return; e.preventDefault(); try{e.dataTransfer.dropEffect='move';}catch(_){}
      const {frac,combine}=combineAt(card,e.clientX);
      document.querySelectorAll('.sbcard').forEach(c=>{ if(c!==card)c.classList.remove('combine','insbefore','insafter'); });
      card.classList.toggle('combine',combine);
      card.classList.toggle('insbefore',!combine&&frac<=0.25);
      card.classList.toggle('insafter',!combine&&frac>=0.75); };
    card.ondragleave=()=>card.classList.remove('combine','insbefore','insafter');
    card.ondrop=e=>{ if(!dragSiteId||card.dataset.id===dragSiteId)return; e.preventDefault();
      const {frac,combine}=combineAt(card,e.clientX); const dragged=dragSiteId; const targetId=card.dataset.id;
      card.classList.remove('combine','insbefore','insafter');
      if(combine) combineNodes(dragged,targetId); else reorderNode(dragged,targetId,frac<0.5); };
  });
}

function rdSplitMermaid(tx){

  if(!window.mermaid){ nodes.forEach(n=>{ if(n.dataset.done==='1')return; const s=n.querySelector('.mmd-src'); fallback(n, s?s.textContent:''); }); return; }

function _plainFromMd(md){
  return (md||'')
    .replace(/```mermaid[\s\S]*?```/g,'')
    .replace(/```[\s\S]*?```/g,'')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\*\*(.+?)\*\*/g,'$1')
    .replace(/^\s*[-–—•·]\s+/gm,'• ')
    .replace(/^\s*\|(.*)\|\s*$/gm,(m,c)=>c.split('|').map(s=>s.trim()).filter(Boolean).join('\t'))
    .replace(/\n{3,}/g,'\n\n').trim();
}
async function _clip(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const r=document.execCommand('copy');ta.remove();return r;}catch(_){return false;} }
}

    add.replaceWith(sp); sp.focus();
    const commit=async()=>{const v=sp.value.trim(); if(v&&!(i.tags||[]).includes(v)){const tags=[...(i.tags||[]),v];await patch(i.id,{tags});renderList();} $('#side').innerHTML=sideBody(i);bindSide(i);};
    sp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){$('#side').innerHTML=sideBody(i);bindSide(i);}});
    sp.addEventListener('blur',commit);
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const tags=(i.tags||[]).filter(t=>t!==b.dataset.rm);await patch(i.id,{tags});renderList();$('#side').innerHTML=sideBody(i);bindSide(i);});
  // glossary
  const gadd=$('#g-add'); if(gadd) gadd.onclick=async()=>{
    const term=$('#g-term').value.trim(), mean=$('#g-mean').value.trim(); if(!term)return;
    const g=[...((i.extensions||{}).glossary||[]),{term,meaning:mean}];
    await patch(i.id,{glossary:g}); $('#side').innerHTML=sideBody(i); bindSide(i);
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const g=((i.extensions||{}).glossary||[]).filter((_,k)=>k!=b.dataset.del);
    await patch(i.id,{glossary:g}); $('#side').innerHTML=sideBody(i); bindSide(i);
  });
  document.querySelectorAll('[data-gi]').forEach(inp=>inp.onchange=async()=>{
    const g=[...((i.extensions||{}).glossary||[])]; g[inp.dataset.gi][inp.dataset.f]=inp.value;
    await patch(i.id,{glossary:g});
  });
}
// ── 입력 ──
async function upload(files){
  let last=null;
  for(const f of files){const fd=new FormData();fd.append('file',f);
    try{
      const r=await fetch('/api/materials',{method:'POST',body:fd});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ showDup('⚠ '+(j.detail||('업로드 실패 '+r.status))+' — '+f.name); continue; }
      if(j.duplicate)showDup(`이미 보관됨: ${j.title||j.id}`); sel=j.id; last=j.id;
      // 번역·요약은 CLI(Claude Code)가 — 올린 자료 보강 창 열기
      try{ await fetch('/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:j.id})}); }catch(_){}
    }catch(e){ showDup('⚠ 업로드 중 오류 — '+f.name); }
  }
  if(last) showDup('🖥️ 업로드 완료 — 번역·요약은 Claude Code 창에서 진행돼요. 끝나면 새로고침.');
  await load();
}
function urlRowHTML(val){ return `<div class="urlrow"><input class="urlinp" type="url" placeholder="링크 주소 (https://…)" value="${esc(val||'')}"><button type="button" class="urlrowx" title="이 칸 비우기/제거">✕</button></div>`; }
function bindUrlRows(){ const box=$('#urlrows'); if(!box)return;
  box.querySelectorAll('.urlrowx').forEach(b=>b.onclick=()=>{ const rows=box.querySelectorAll('.urlrow'); if(rows.length<=1){ const i=b.closest('.urlrow').querySelector('.urlinp'); if(i){i.value='';i.focus();} return; } b.closest('.urlrow').remove(); });
  box.querySelectorAll('.urlinp').forEach(inp=>inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(e.ctrlKey||e.metaKey) addLink(); else addUrlRow(true); } });
}
function renderUrlRows(vals){ const box=$('#urlrows'); if(!box)return; const arr=(vals&&vals.length)?vals:['']; box.innerHTML=arr.map(urlRowHTML).join(''); bindUrlRows(); }
function addUrlRow(focus){ const box=$('#urlrows'); if(!box)return; box.insertAdjacentHTML('beforeend',urlRowHTML('')); bindUrlRows(); if(focus){ const inps=box.querySelectorAll('.urlinp'); if(inps.length)inps[inps.length-1].focus(); } }
async function addLink(){
  const btn=$('#startadd');
  const raw=[...document.querySelectorAll('#urlrows .urlinp')].map(i=>(i.value||'').trim()).filter(Boolean);
  const seen=new Set(); const urls=raw.filter(u=>{ if(seen.has(u))return false; seen.add(u); return true; });  // 같은 URL 중복 제거
  if(!urls.length)return;
  btn.disabled=true;const lab=btn.textContent;
  let ok=0,fail=0,lastErr='';
  for(let i=0;i<urls.length;i++){
    btn.textContent=urls.length>1?`여는 중… (${i+1}/${urls.length})`:'여는 중…';
    try{
      const r=await fetch('/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:urls[i]})});
      if(r.ok){ ok++; } else { fail++; const j=await r.json().catch(()=>({})); lastErr=(j&&j.detail)||('실패 '+r.status); }
    }catch(e){ fail++; lastErr='네트워크 오류'; }
  }
  btn.disabled=false;btn.textContent=lab;
  if(ok){ closeStart();
    showDup(urls.length>1
      ? `🖥️ ${ok}건을 수집 창에 넣었어요${fail?` (실패 ${fail})`:''} — 한 창에서 순서대로 처리돼요. 끝나면 새로고침.`
      : '🖥️ 수집 창(Claude Code)을 열었어요. 창에서 처리되고, 끝나면 새로고침하면 보여요.');
  } else { showDup('⚠ '+(lastErr||'수집 창 열기 실패')); }
}
function showDup(m){const d=$('#dup');d.style.display='block';d.textContent=m;setTimeout(()=>d.style.display='none',3500);}
// ── 아카이빙 시작 모달 ──
let pendingFiles=[];
function renderFileList(){
  const fl=$('#filelist'); if(!fl)return;
  if(pendingFiles&&pendingFiles.length){
    fl.innerHTML=pendingFiles.map((f,idx)=>`<div class="flrow"><span class="flname">📄 ${esc(f.name)}</span><span class="flsz">${(f.size/1024).toFixed(0)} KB</span><button type="button" class="flx" data-i="${idx}" title="제거">×</button></div>`).join('');
    fl.querySelectorAll('.flx').forEach(b=>b.onclick=()=>removeFile(+b.dataset.i));
    fl.hidden=false;
  } else { fl.innerHTML=''; fl.hidden=true; }
}
function removeFile(idx){ if(!pendingFiles)return; pendingFiles.splice(idx,1); const fi=$('#file'); if(fi)fi.value=''; renderFileList(); }
function clearFiles(){pendingFiles=[];const fi=$('#file');if(fi)fi.value='';renderFileList();}
function openStart(){$('#startmodal').hidden=false;clearFiles();renderUrlRows(['']);setTimeout(()=>{const i=$('#urlrows .urlinp');if(i)i.focus();},30);}
function closeStart(){$('#startmodal').hidden=true;}
$('#startbtn').onclick=openStart;
$('#startcancel').onclick=closeStart;
$('#startmodal').onclick=e=>{if(e.target===$('#startmodal'))closeStart();};
$('#pvclose').onclick=()=>$('#previewmodal').hidden=true;
$('#previewmodal').onclick=e=>{if(e.target===$('#previewmodal'))$('#previewmodal').hidden=true;};
$('#daymclose').onclick=()=>$('#daymodal').hidden=true;
$('#daymodal').onclick=e=>{if(e.target===$('#daymodal'))$('#daymodal').hidden=true;};
// ── 머메이드 다이어그램 크게 보기 (리더/나란히/PDF 페이지 공통) ──
let _mmdZoom=1,_mmdBaseW=0;
function _applyMmdZoom(){const s=document.querySelector('#mmdstage svg'); if(s) s.style.width=Math.round(_mmdBaseW*_mmdZoom)+'px';}
function openMmdModal(svg){
  const m=$('#mmdmodal'), stage=$('#mmdstage'); if(!m||!stage||!svg) return;
  stage.innerHTML='';
  const clone=svg.cloneNode(true);
  clone.removeAttribute('height'); clone.style.height='auto'; clone.style.maxWidth='none';
  let nat=0;
  try{ if(clone.viewBox&&clone.viewBox.baseVal&&clone.viewBox.baseVal.width) nat=clone.viewBox.baseVal.width; }catch(e){}
  if(!nat){ nat=parseFloat(svg.getAttribute('width'))||svg.getBoundingClientRect().width||800; }
  _mmdBaseW=Math.max(nat,320);
  _mmdZoom=Math.max(1, Math.min(2.4, (window.innerWidth*0.92)/_mmdBaseW)); // 열 때 화면폭에 맞춰 크게(최소 1배)
  stage.appendChild(clone);
  _applyMmdZoom();
  m.hidden=false;
}
function closeMmdModal(){const m=$('#mmdmodal'); if(m){m.hidden=true; const st=$('#mmdstage'); if(st)st.innerHTML='';}}
// 구조화 HTML 도식: 패널 폭에 맞춰 축소(가로 스크롤 없이, 원본 가로 배치 유지)
function fitRdHtml(root){
  const els=(root||document).querySelectorAll('.osnap .rdhtml');
  if(!els.length) return;
  const run=()=>els.forEach(el=>{
    const inner=el.firstElementChild; if(!inner) return;
    inner.style.transform='none'; el.style.height=''; inner.style.zoom=1;
    const cw=el.clientWidth, nw=Math.max(inner.scrollWidth, inner.firstElementChild?inner.firstElementChild.scrollWidth:0);
    if(nw>cw+1 && cw>0) inner.style.zoom = cw/nw;   // zoom은 박스까지 축소 → 잘림 없이 폭에 맞음
  });
  requestAnimationFrame(()=>{ run(); requestAnimationFrame(run); }); // 레이아웃·폰트 반영 후 측정
}
// 도식 클릭 → 큰 모달에서 원본 크기로
function openHtmlModal(el){
  const m=$('#mmdmodal'), stage=$('#mmdstage'); const inner=el&&el.firstElementChild; if(!m||!stage||!inner) return;
  stage.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='mmdhtmlwrap';
  const clone=inner.cloneNode(true); clone.style.transform='none';
  wrap.appendChild(clone); stage.appendChild(wrap);
  m.hidden=false;
  // 화면(가로·세로) 안에 완전히 들어오게 zoom으로 맞춤(넘침 제거)
  requestAnimationFrame(()=>{
    wrap.style.zoom=1;
    const availW=Math.max(100,stage.clientWidth-60), availH=Math.max(100,stage.clientHeight-48);
    const nw=wrap.scrollWidth||800, nh=wrap.scrollHeight||400;
    const s=Math.max(0.3, Math.min(1.8, Math.min(availW/nw, availH/nh)));
    wrap.style.zoom=s;
  });
}
$('#mmdin').onclick=()=>{_mmdZoom=Math.min(6,_mmdZoom*1.25);_applyMmdZoom();};
$('#mmdout').onclick=()=>{_mmdZoom=Math.max(0.3,_mmdZoom*0.8);_applyMmdZoom();};
$('#mmdfit').onclick=()=>{_mmdZoom=Math.max(0.3,Math.min(2.4,(window.innerWidth*0.92)/_mmdBaseW));_applyMmdZoom();};
$('#mmdclose').onclick=closeMmdModal;
$('#mmdmodal').onclick=e=>{ if(e.target===$('#mmdmodal')||e.target===$('#mmdstage')) closeMmdModal(); };
$('#fsin').onclick=()=>setFsZoom(fsZoom*1.2);
$('#fsout').onclick=()=>setFsZoom(fsZoom/1.2);
$('#fsfit').onclick=()=>setFsZoom(100);
$('#fsclose').onclick=closeFsModal;
$('#fsmodal').onclick=e=>{ if(e.target===$('#fsmodal')||e.target===$('#fsbody')) closeFsModal(); };
// 리더에 렌더된 다이어그램 클릭 → 확대 (이벤트 위임: 뷰 전환으로 DOM이 갈려도 동작)
document.addEventListener('click',e=>{
  if(!e.target.closest) return;
  const modal=$('#mmdmodal'); if(modal && !modal.hidden) return; // 모달 내부 클릭은 제외
  const mmd=e.target.closest('.osnap .mmd'); if(mmd){ const svg=mmd.querySelector('svg'); if(svg) openMmdModal(svg); return; }
  const rh=e.target.closest('.osnap .rdhtml'); if(rh){ openHtmlModal(rh); }
});
window.addEventListener('resize',()=>{ try{ fitRdHtml(document); }catch(e){} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){const m=$('#mmdmodal'); if(m&&!m.hidden){closeMmdModal();return;} const f=$('#fsmodal'); if(f&&!f.hidden) closeFsModal();} });
$('#file').onchange=e=>{ pendingFiles = e.target.files ? [...e.target.files] : []; renderFileList(); };
$('#startadd').onclick=async()=>{
  if(pendingFiles&&pendingFiles.length){ const fs=pendingFiles; pendingFiles=[]; renderFileList(); closeStart(); await upload(fs); }
  else { addLink(); }
};
$('#urladdrow').onclick=()=>addUrlRow(true);
// 전역 드래그&드롭 → 파일 업로드 (파일이 들어있는 드래그만 처리; 텍스트 선택 드래그 등은 무시)
function _dragHasFiles(e){ const dt=e.dataTransfer; if(!dt) return false; if(dt.files&&dt.files.length>0) return true; return dt.types ? Array.from(dt.types).includes('Files') : false; }
function _inViewer(e){ return !!(e.target&&e.target.closest&&e.target.closest('.osnap,.mmdmodal,iframe')); }
document.addEventListener('dragover',e=>{ if(_inViewer(e)) return; if(_dragHasFiles(e)) e.preventDefault(); });
document.addEventListener('drop',e=>{
  if(_inViewer(e)) return;                                   // 원문 뷰어(PDF 등) 내부 드래그는 무시 → CLI 안 열림
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length>0){
    e.preventDefault();
    openStart();                                             // 자동 수집/CLI 실행 없이
    pendingFiles=[...e.dataTransfer.files];                  // 모달에 파일만 올려두고
    renderFileList();                                        // '수집 시작'을 눌러야 진행
  }
});
// 상세 좌우 분할 드래그 핸들
let _gDrag=false,_gSV=null;
document.addEventListener('mousemove',e=>{if(!_gDrag||!_gSV)return;const r=_gSV.getBoundingClientRect();let left=Math.max(220,Math.min(r.width-220,e.clientX-r.left));const pw=Math.round(r.width-left-6);_gSV.style.gridTemplateColumns='minmax(0,1fr) 6px '+pw+'px';_gSV.style.setProperty('--rpw',pw+'px');});
document.addEventListener('mouseup',()=>{if(_gDrag){_gDrag=false;if(_gSV){_gSV.style.transition='';_gSV.classList.remove('gdrag');}document.body.style.userSelect='';}});
/* esc → js/util.js */
document.querySelector('.brand').onclick=()=>go(null);
{const rch=document.getElementById('railcollapse'); if(rch)rch.onclick=toggleRail; const rop=document.getElementById('railopen'); if(rop)rop.onclick=toggleRail;}
// ── 수집 진행 상황판(경량): /api/jobs 를 폴링해 "수집 중"을 표시. LLM 토큰 안 씀(로컬 HTTP만). ──
(function(){const s=document.createElement('style');s.textContent=`
#jobbar{display:flex;flex-direction:column;gap:6px;margin:8px 0}
#jobbar:empty{display:none}
.jobc{display:flex;align-items:center;gap:8px;background:rgba(255,154,60,.12);border:1px solid rgba(255,154,60,.38);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer}
.jobc .jl{min-width:0;display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
.jobc .jstage{font-weight:650;color:#b45309;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobc .jwho{font-size:10.5px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobc .spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,154,60,.3);border-top-color:#ff9a3c;animation:ahkspin .8s linear infinite;flex:none}
@keyframes ahkspin{to{transform:rotate(360deg)}}
`;document.head.appendChild(s);})();
let _jobIds=new Set();
function jobUrlLabel(u){ try{ const o=new URL(u); let p=(o.pathname||'').replace(/\/+$/,''); let s=o.hostname.replace(/^www\./,'')+p; return s.length>40?s.slice(0,40)+'…':s; }catch(e){ return (u||'').replace(/^https?:\/\//,'').slice(0,40); } }
function jobElapsed(t){ if(!t)return''; const s=Math.max(0,Math.floor(Date.now()/1000-t)); if(s<60)return s+'초째'; return Math.floor(s/60)+'분째'; }
async function pollJobs(){
  let jobs=[];
  try{const r=await fetch('/api/jobs');if(r.ok)jobs=await r.json();}catch(e){return;}
  const bar=$('#jobbar');
  if(bar){
    bar.innerHTML=jobs.map(j=>{
      let title;
      if(j.kind==='enrich'){ const it=(items||[]).find(x=>x.id===j.item_id); title='보강 · '+(it?(it.title||it.id):(j.item_id||'자료')); }
      else { title=jobUrlLabel(j.url||j.label||'')||'링크'; }
      const el=jobElapsed(j.started);
      const sub=esc((j.stage||'수집 중')+(el?' · '+el:''));
      return `<div class="jobc" data-job="${j.id}" title="${esc(title)}\n(클릭하면 이 표시를 지워요)"><span class="spin"></span><span class="jl"><span class="jstage">${esc(title)}</span><span class="jwho">${sub}</span></span></div>`;
    }).join('');
    bar.querySelectorAll('[data-job]').forEach(b=>b.onclick=async()=>{try{await fetch('/api/jobs/'+b.dataset.job,{method:'DELETE'});}catch(e){}pollJobs();});
  }
  // 작업이 사라지면(=완료) 목록을 한 번만 새로고침. 입력 편집/모달 중이면 미룬다(다음 틱에 반영).
  const nowIds=new Set(jobs.map(j=>j.id));
  let completed=false; _jobIds.forEach(id=>{if(!nowIds.has(id))completed=true;});
  _jobIds=nowIds;
  if(completed){
    const ae=document.activeElement, tag=ae&&ae.tagName;
    const editing=tag==='INPUT'||tag==='TEXTAREA';
    const modalOpen=[...document.querySelectorAll('.modal')].some(m=>!m.hidden);
    if(!editing && !modalOpen) load();
  }
}
setInterval(pollJobs, 4000);
pollJobs();
load();
